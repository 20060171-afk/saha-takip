<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTM Saha Takip Dashboard</title>
<script>
// Karanlık/Aydınlık mod tercihi — sayfa daha çizilmeden (CSS yüklenmeden
// önce) uygulanıyor, aksi halde bir an için yanlış temayla açılıp sonra
// doğru temaya "zıplama" olurdu (flaş etkisi).
(function(){
  try{
    const saved = localStorage.getItem('saha_takip_theme');
    if(saved === 'dark' || saved === 'light'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --border:#e5e7eb; --border-strong:#cbd2db;
  --text:#0f172a; --text-2:#4b5768; --text-muted:#8891a0;
  --accent:#0c8f8f; --accent-2:#0f766e; --accent-bg:#e3f5f4; --accent-text:#0b6e6e;
  --navy:#eef3f6; --navy-2:#e3ecf2;
  --hero-heading:#0f172a; --hero-text:#4b5768; --hero-text-2:#6b7686;
  --hero-pill-bg:rgba(15,23,42,0.05); --hero-pill-border:rgba(15,23,42,0.13);
  --hero-time:#0f172a; --hero-date:#4b5768;
  --green:#1a9670; --green-bg:#e1f5ee; --green-text:#0a6b4f;
  --amber:#c07a14; --amber-bg:#faeeda; --amber-text:#8a5209;
  --red:#c33f3f; --red-bg:#fcebeb; --red-text:#a12e2e;
  --gray-bg:#eef0f3;
  --radius:12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Plus Jakarta Sans', var(--font);
  --shadow-sm:0 1px 2px rgba(15,23,42,0.06);
  --shadow-md:0 6px 20px -6px rgba(15,23,42,0.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --card:#151b25; --border:#262e3a; --border-strong:#38424f;
    --text:#e9edf3; --text-2:#a6b0bf; --text-muted:#707a89;
    --accent:#2dd4c8; --accent-2:#14b8a6; --accent-bg:#0e2d2c; --accent-text:#5eead4;
    --navy:#070b14; --navy-2:#0f1626;
    --hero-heading:#f4fffd; --hero-text:#a8b3c7; --hero-text-2:#8b95a8;
    --hero-pill-bg:rgba(255,255,255,0.06); --hero-pill-border:rgba(255,255,255,0.1);
    --hero-time:#ffffff; --hero-date:#93a0b8;
    --green:#3fb98d; --green-bg:#123a2c; --green-text:#6fd3ae;
    --amber:#e0a13c; --amber-bg:#3c2c0c; --amber-text:#f0bd6a;
    --red:#e06868; --red-bg:#3c1c1c; --red-text:#f09a9a;
    --gray-bg:#1b2230;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 10px 28px -8px rgba(0,0,0,0.5);
  }
}
/* Kullanıcının elle seçtiği tema (karanlık/aydınlık düğmesi) — sistem
   ayarından bağımsız olarak zorlar. Düğmeye hiç basılmadıysa data-theme
   hiç yazılmaz ve yukarıdaki sistem tercihi (prefers-color-scheme) geçerli
   olmaya devam eder. */
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#151b25; --border:#262e3a; --border-strong:#38424f;
  --text:#e9edf3; --text-2:#a6b0bf; --text-muted:#707a89;
  --accent:#2dd4c8; --accent-2:#14b8a6; --accent-bg:#0e2d2c; --accent-text:#5eead4;
  --navy:#070b14; --navy-2:#0f1626;
  --hero-heading:#f4fffd; --hero-text:#a8b3c7; --hero-text-2:#8b95a8;
  --hero-pill-bg:rgba(255,255,255,0.06); --hero-pill-border:rgba(255,255,255,0.1);
  --hero-time:#ffffff; --hero-date:#93a0b8;
  --green:#3fb98d; --green-bg:#123a2c; --green-text:#6fd3ae;
  --amber:#e0a13c; --amber-bg:#3c2c0c; --amber-text:#f0bd6a;
  --red:#e06868; --red-bg:#3c1c1c; --red-text:#f09a9a;
  --gray-bg:#1b2230;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 10px 28px -8px rgba(0,0,0,0.5);
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --card:#ffffff; --border:#e5e7eb; --border-strong:#cbd2db;
  --text:#0f172a; --text-2:#4b5768; --text-muted:#8891a0;
  --accent:#0c8f8f; --accent-2:#0f766e; --accent-bg:#e3f5f4; --accent-text:#0b6e6e;
  --navy:#eef3f6; --navy-2:#e3ecf2;
  --hero-heading:#0f172a; --hero-text:#4b5768; --hero-text-2:#6b7686;
  --hero-pill-bg:rgba(15,23,42,0.05); --hero-pill-border:rgba(15,23,42,0.13);
  --hero-time:#0f172a; --hero-date:#4b5768;
  --green:#1a9670; --green-bg:#e1f5ee; --green-text:#0a6b4f;
  --amber:#c07a14; --amber-bg:#faeeda; --amber-text:#8a5209;
  --red:#c33f3f; --red-bg:#fcebeb; --red-text:#a12e2e;
  --gray-bg:#eef0f3;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.06);
  --shadow-md:0 6px 20px -6px rgba(15,23,42,0.16);
}
.theme-toggle-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--border-strong);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;line-height:1;box-shadow:var(--shadow-sm);}
.theme-toggle-btn:hover{border-color:var(--accent);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;}
.top-accent{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 0%,#6366f1 50%,var(--accent) 100%);background-size:200% 100%;z-index:120;animation:accentflow 6s linear infinite;}
@keyframes accentflow{0%{background-position:0% 0;}100%{background-position:200% 0;}}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
h1{font-family:var(--font-display);font-size:22px;font-weight:800;margin:0;letter-spacing:0.01em;color:var(--hero-heading);animation:neonBreathe 3.6s ease-in-out infinite;}@keyframes neonBreathe{0%,100%{text-shadow:0 0 4px rgba(45,212,200,0.55),0 0 11px rgba(45,212,200,0.35),0 0 24px rgba(99,102,241,0.28);}50%{text-shadow:0 0 7px rgba(45,212,200,0.85),0 0 18px rgba(45,212,200,0.6),0 0 38px rgba(99,102,241,0.45);}}
.sub{color:var(--hero-text);font-size:13px;margin-top:3px;}
.hero{background-image:linear-gradient(155deg,var(--navy) 0%,var(--navy-2) 100%),linear-gradient(rgba(45,212,200,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(45,212,200,0.055) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px;background-position:center;border:1px solid rgba(45,212,200,0.16);border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow-md),0 0 0 1px rgba(45,212,200,0.05),0 0 40px -12px rgba(45,212,200,0.35);position:relative;overflow:hidden;animation:heroGlow 6s ease-in-out infinite;}@keyframes heroGlow{0%,100%{box-shadow:var(--shadow-md),0 0 0 1px rgba(45,212,200,0.05),0 0 40px -12px rgba(45,212,200,0.3);}50%{box-shadow:var(--shadow-md),0 0 0 1px rgba(45,212,200,0.09),0 0 55px -10px rgba(99,102,241,0.4);}}
.hero::after{content:'';position:absolute;top:-60%;right:-10%;width:340px;height:340px;background:radial-gradient(circle, rgba(45,212,200,0.16) 0%, rgba(45,212,200,0) 70%);pointer-events:none;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;position:relative;}
.brand-row{display:flex;align-items:flex-start;gap:12px;}
.brand-logo-wrap{flex-shrink:0;position:relative;width:156px;height:57px;border-radius:13px;background:radial-gradient(circle at 30% 20%,rgba(45,212,200,0.16),rgba(15,23,42,0.4) 70%);border:1px solid rgba(45,212,200,0.35);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px rgba(45,212,200,0.08),0 0 22px -2px rgba(45,212,200,0.55),inset 0 0 14px rgba(45,212,200,0.12);}.brand-logo-wrap::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0deg,rgba(45,212,200,0.4) 60deg,transparent 120deg,transparent 240deg,rgba(99,102,241,0.32) 300deg,transparent 360deg);animation:brandSpin 5s linear infinite;opacity:0.5;}.brand-logo-wrap img{position:relative;width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 0 2px rgba(45,212,200,0.55)) drop-shadow(0 0 5px rgba(99,102,241,0.3)) brightness(1.08) saturate(1.05);}@keyframes brandSpin{to{transform:rotate(360deg);}}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--hero-text);background:var(--hero-pill-bg);border:1px solid var(--hero-pill-border);padding:4px 10px 4px 8px;border-radius:999px;margin-top:8px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 rgba(52,211,153,0.6);animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5);}70%{box-shadow:0 0 0 6px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
.intro-text{font-size:13px;color:var(--hero-text-2);margin:0 0 14px;max-width:720px;line-height:1.6;position:relative;}
.legend{display:flex;gap:8px;flex-wrap:wrap;position:relative;}
.hero .status{border:1px solid var(--hero-pill-border);}
.badge-role{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--hero-pill-border);color:var(--hero-text);background:var(--hero-pill-bg);white-space:nowrap;}
.auth-wrap{display:flex;align-items:center;gap:8px;}
.badge-role.admin{color:var(--accent-text);background:var(--accent-bg);border-color:var(--accent);}
.link-btn{background:none;border:none;font-family:var(--font);font-size:12px;color:var(--hero-text);cursor:pointer;padding:0;text-decoration:underline;}
.tabs{display:flex;gap:4px;background:var(--gray-bg);padding:4px;border-radius:11px;width:fit-content;margin-bottom:18px;border:1px solid var(--border);}
.tab-btn{border:none;background:transparent;padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;font-family:var(--font);transition:background .15s,color .15s;}
.tab-btn.active{background:var(--card);color:var(--accent-2);box-shadow:var(--shadow-sm);}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s;}
.metric .lbl{font-size:11.5px;font-weight:500;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.03em;}
.metric .val{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.01em;}
.metric.clickable{cursor:pointer;user-select:none;}
.metric.clickable:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.metric.clickable:active{transform:translateY(0) scale(0.98);}
.metric.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.metric.active .val{color:var(--accent-2);}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
input[type=text], input[type=date], select, textarea{
  font-family:var(--font);font-size:14px;color:var(--text);background:var(--card);
  border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.search{flex:1;min-width:180px;}
.btn{font-family:var(--font);font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;border:1px solid var(--border-strong);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--gray-bg);}
.btn:active{transform:scale(0.97);}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff;box-shadow:0 2px 10px -2px rgba(12,143,143,0.45);}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);}
.btn.danger{color:var(--red-text);border-color:var(--red);}
.btn.small{padding:5px 11px;font-size:12px;}
.list{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s;animation:cardIn .28s ease both;}@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.card-left{flex:1;min-width:0;}
.saha-name{font-weight:600;font-size:15px;}
.saha-meta{font-size:12.5px;color:var(--text-2);margin-top:2px;}
.card-right{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;}
.donut{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:conic-gradient(var(--clr) calc(var(--pct)*1%), var(--gray-bg) 0);}
.donut-hole{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text);}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.tag{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--gray-bg);color:var(--text-2);}
.tag.energy{background:var(--accent-bg);color:var(--accent-text);}
.status{font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:500;}
.status.done{background:var(--green-bg);color:var(--green-text);}
.status.ongoing{background:var(--accent-bg);color:var(--accent-text);}
.status.stalled{background:var(--amber-bg);color:var(--amber-text);}
.step-label{font-size:12.5px;color:var(--text-2);margin-top:10px;}
.counter-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
.counter{font-size:12.5px;color:var(--text-2);}
.counter b{color:var(--text);font-weight:600;}
.card-actions{display:flex;gap:6px;}
.aciklama{font-size:12.5px;color:var(--text-2);margin-top:6px;font-style:italic;}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:14px;}
.modal-overlay{position:fixed;inset:0;overflow-y:auto;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:100;animation:overlayIn .18s ease both;}@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:20px 22px 22px;border:1px solid var(--border);max-height:90vh;overflow-y:auto;animation:modalIn .22s cubic-bezier(.16,1,.3,1) both;}@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:4px;}
.field input, .field select, .field textarea{width:100%;}
.field textarea{resize:vertical;min-height:44px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.steps-detail{border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}
.steps-detail summary{cursor:pointer;font-size:12.5px;color:var(--text-2);}
.story-detail{border-top:1px dashed var(--border);padding-top:8px;margin-top:10px;margin-bottom:4px;}
.story-detail summary{cursor:pointer;font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;list-style:none;user-select:none;}
.story-detail summary::-webkit-details-marker{display:none;}
.story-detail summary svg{flex-shrink:0;opacity:0.7;}
.story-hint{font-style:italic;color:var(--text-muted);font-weight:400;}
.story-detail textarea{width:100%;margin-top:8px;min-height:70px;font-size:13px;background:var(--gray-bg);}
.story-detail[open] summary{color:var(--text-2);}
.step-item{margin-top:8px;}
.step-item label{font-size:12px;color:var(--text-muted);}
.err{color:var(--red-text);font-size:12.5px;margin-top:4px;}
.dist-title{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text);}
.dist-sub{font-size:12px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
.donut-summary{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.donut-left{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.donut-big{width:140px;height:140px;flex-shrink:0;position:relative;}
.donut-seg{cursor:pointer;transition:opacity .15s;}
.donut-seg:hover{opacity:0.85;}
.donut-big-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-big-hole .num{font-size:22px;font-weight:600;color:var(--text);line-height:1.2;}
.donut-big-hole .lbl{font-size:10.5px;color:var(--text-muted);}
.donut-tooltip{position:fixed;display:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:8px 12px;border-radius:6px;max-width:280px;white-space:normal;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.25);pointer-events:none;z-index:80;}
.legend-list{display:flex;flex-direction:column;gap:9px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);}
.legend-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.mini-stats{display:flex;flex-direction:column;gap:12px;text-align:right;flex-shrink:0;}
.mini-stat-lbl{font-size:11px;color:var(--text-muted);}
.mini-stat-val{font-size:13.5px;font-weight:600;color:var(--text);margin-top:2px;}
.foot{font-size:11.5px;color:var(--text-muted);margin-top:34px;text-align:center;line-height:1.6;}

.inline-edit-card{border:1.5px solid var(--accent);margin-top:-8px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,0.10);}
.inline-edit-title{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--text);}
.quick-assign-field{background:rgba(120,120,255,0.07);border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.quick-assign-field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;}
.quick-assign-field input{width:100%;font-size:13.5px;}
.quick-assign-row{display:flex;gap:8px;}
.quick-assign-row select{flex:2;min-width:0;font-size:13.5px;}
.quick-assign-row input{flex:1;min-width:0;font-size:13.5px;}
.quick-assign-hint{font-size:11px;color:var(--text-muted);margin-top:7px;line-height:1.4;}
.step-contact-row{display:flex;gap:8px;margin-top:6px;}
.step-contact-row select{flex:2;min-width:0;font-size:13px;}
.step-contact-row input{flex:1;min-width:0;font-size:13px;}
.contact-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.contact-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.contact-row-label{font-size:13px;font-weight:600;color:var(--text);}
.contact-row-email{font-size:12px;color:var(--text-muted);margin-top:1px;}
.history-scroll{max-height:260px;overflow-y:auto;padding-right:2px;}

/* ---- Pusula chatbot widget ---- */
.chat-fab{
  position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;cursor:pointer;z-index:90;
  box-shadow:0 4px 14px rgba(0,0,0,0.22);display:flex;align-items:center;justify-content:center;
  font-size:24px;transition:transform .15s;
}
.chat-fab:hover{transform:scale(1.06);}
.chat-fab.hidden{display:none;}
.chat-panel{
  position:fixed;right:20px;bottom:20px;width:360px;max-width:calc(100vw - 32px);
  height:520px;max-height:calc(100vh - 40px);background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,0.28);z-index:95;
  display:none;flex-direction:column;overflow:hidden;
}
.chat-panel.open{display:flex;animation:modalIn .2s cubic-bezier(.16,1,.3,1) both;}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-head-title{font-size:14px;font-weight:600;}
.chat-head-sub{font-size:11px;color:var(--text-muted);margin-top:1px;}
.chat-close{background:none;border:none;color:var(--text-2);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;}
.chat-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:85%;font-size:13px;line-height:1.5;padding:8px 11px;border-radius:10px;white-space:pre-wrap;}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
.chat-msg.bot{align-self:flex-start;background:var(--gray-bg);color:var(--text);border-bottom-left-radius:3px;}
.chat-msg.bot.typing{color:var(--text-muted);font-style:italic;}
.chat-msg.bot.error{background:var(--red-bg);color:var(--red-text);}
.chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0;}
.chat-input-row textarea{flex:1;resize:none;min-height:38px;max-height:90px;font-size:13px;}
.chat-empty{color:var(--text-muted);font-size:12.5px;text-align:center;padding:20px 10px;}
.chat-not-configured{font-size:12px;color:var(--text-muted);text-align:center;padding:16px;line-height:1.6;}
.datetime-pill{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--font-display);}
.datetime-pill .dt-time{font-size:20px;font-weight:700;color:var(--hero-time);letter-spacing:0.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.datetime-pill .dt-date{font-size:11.5px;font-weight:500;color:var(--hero-date);text-transform:capitalize;margin-top:1px;}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}

/* ---- Küçük ekran (telefon) ince ayarları ---- */
@media (max-width:640px){
  .wrap{padding:14px 10px 40px;}
  .hero{padding:16px 15px;border-radius:13px;}
  .brand-logo-wrap{width:118px;height:43px;border-radius:10px;}
  h1{font-size:17px;}
  .sub{font-size:12px;}
  .topbar{gap:10px;}
  .hero-right{align-items:flex-start;width:100%;}
  .datetime-pill{align-items:flex-start;}
  .metrics{grid-template-columns:repeat(2,1fr);gap:8px;}
  .metric{padding:11px 12px;}
  .metric .val{font-size:19px;}
  .controls{flex-direction:column;align-items:stretch;}
  .controls .search{min-width:0;}
  .controls select, .controls .btn{width:100%;justify-content:center;}
  .donut-summary{flex-direction:column;align-items:flex-start;gap:16px;}
  .mini-stats{text-align:left;width:100%;}
  .card-top{flex-wrap:wrap;}
  .row2{grid-template-columns:1fr;}
  .modal{padding:16px 16px 18px;border-radius:12px;}
  .chat-panel{right:10px;left:10px;width:auto;bottom:78px;}
  .chat-fab{right:14px;bottom:14px;}
}
</style>
</head>

// ---- Karanlık / Aydınlık mod ----
// data-theme özniteliği yoksa sistem tercihine (prefers-color-scheme) göre
// otomatik davranır (bkz. <style>); kullanıcı düğmeye basınca localStorage'a
// yazılıp sistem tercihinden bağımsız olarak zorlanır.
function currentEffectiveTheme_(){
  const forced = document.documentElement.getAttribute('data-theme');
  if(forced === 'dark' || forced === 'light') return forced;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function updateThemeToggleIcon_(){
  const btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  const eff = currentEffectiveTheme_();
  // Karanlık moddaysak güneş ikonu göster (tıklayınca aydınlığa geçer), tersi de öyle.
  btn.textContent = eff === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const next = currentEffectiveTheme_() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('saha_takip_theme', next); }catch(e){}
  updateThemeToggleIcon_();
}
updateThemeToggleIcon_();
// Sistem teması değişirse (ör. bilgisayar akşam otomatik karanlık moda
// geçerse) ve kullanıcı kendi elle bir seçim yapmadıysa, ikonu da güncelle.
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if(!document.documentElement.getAttribute('data-theme')) updateThemeToggleIcon_();
  });
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a, b){
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function collFor(cat){ return cat === 'kule' ? 'saha_kule' : 'saha_bina'; }
function trashCollFor(cat){ return cat === 'kule' ? 'trash_kule' : 'trash_bina'; }
function fmtDateTime(iso){
  if(!iso) return '-';
  try{ return new Date(iso).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}

function rowToDoc(row){
  return {
    sahaKodu: row.sahaKodu || '', sahaNo: row.sahaNo || '', enerji: row.enerji || '',
    sahaAdi: row.sahaAdi || '', aciklama: row.aciklama || '',
    stepNotes: row.stepNotes || [], currentStep: row.currentStep || 0,
    totalSteps: row.totalSteps, completed: !!row.completed,
    startDate: row.startDate || null, completionDate: row.completionDate || null,
    updatedAt: new Date().toISOString(),
  };
}

async function ensureSeeded(){
  try{
    const meta = await fdb.collection('meta').doc('seed_v1').get();
    if(meta.exists) return;
    for(const cat of ['kule','bina']){
      const coll = fdb.collection(collFor(cat));
      for(let i=0;i<SEED[cat].rows.length;i++){
        await coll.doc('seed_'+cat+'_'+i).set(rowToDoc(SEED[cat].rows[i]));
      }
    }
    await fdb.collection('meta').doc('seed_v1').set({ seededAt: new Date().toISOString() });
  }catch(e){ console.error('seed error', e); }
}

  fdb.collection(collFor(cat)).onSnapshot((snap) => {
    STATE.data[cat] = snap.docs.map(d => ({ id: d.id, ...d.data() }));

function computeStatus(item){
  const total = item.totalSteps || labelsFor(STATE.tab).length;
  const pct = Math.round(((item.currentStep||0) / total) * 100);
  const start = item.startDate;
  let days = null;
  if(start){
    if(item.completed && item.completionDate) days = daysBetween(start, item.completionDate);
    else if(!item.completed) days = daysBetween(start, todayISO());
  }
  let statusClass='ongoing', statusText='Devam ediyor';
  if(item.completed){ statusClass='done'; statusText='Tamamlandı'; }
  else if(days !== null && days > 60){ statusClass='stalled'; statusText='Gecikiyor'; }
  return { pct, days, statusClass, statusText };
}

function buildSummaryPanel(items, labels){
  const total = items.length;
  const counts = new Array(labels.length).fill(0);
  let notStartedCount = 0;
  items.forEach(it => {
    const cs = it.currentStep || 0;
    if(cs>=1 && cs<=labels.length) counts[cs-1]++;
    else notStartedCount++; // "Başlanmadı" — hiçbir adıma girilmemiş sahalar; önceden halka
                            // grafikte hiç gösterilmiyordu (toplam sayıya dahildi ama dilimi yoktu).
  });
  const palette = ['#2dd4c8','#38bdf8','#6366f1','#a78bfa','#f472b6','#fb923c','#facc15','#94a3b8'];
  const segments = [];
  if(notStartedCount>0){
    segments.push({ i:-1, c: notStartedCount, color:'#64748b', label:'Başlanmadı' });
  }
  counts.forEach((c,i) => {
    if(c<=0) return;
    const isDone = i===labels.length-1;
    const color = isDone ? '#22c55e' : palette[i % palette.length];
    segments.push({ i, c, color, label: (i+1)+'. '+labels[i] });
  });
  let legendRows = '';
  segments.forEach(seg => {
    legendRows += `<div class="legend-row"><span class="dot" style="background:${seg.color}"></span><span>${escapeHtml(seg.label)}</span></div>`;
  });

  const size=140, thickness=26, r=(size-thickness)/2, cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  let cumulative = 0, circles = '';
  segments.forEach(seg => {
    const frac = total ? seg.c/total : 0;
    const pct = total ? Math.round(seg.c/total*100) : 0;
    const dash = frac*circumference;
    const gap = circumference-dash;
    const offset = -(cumulative*circumference);
    cumulative += frac;
    const namesInStep = seg.i===-1
      ? items.filter(it => !((it.currentStep||0)>=1)).map(it => it.sahaKodu || it.sahaAdi || 'İsimsiz saha')
      : items.filter(it => (it.currentStep||0)-1 === seg.i).map(it => it.sahaKodu || it.sahaAdi || 'İsimsiz saha');
    const infoRaw = seg.label+' — '+seg.c+' saha · %'+pct+(namesInStep.length ? (': '+namesInStep.join(', ')) : '');
    const info = escapeHtml(infoRaw).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    circles += `<circle class="donut-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}"
      stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
      onmouseenter="showDonutTip(event,'${info}')" onmousemove="positionDonutTip(event)" onmouseleave="hideDonutTip()"
      onclick="event.stopPropagation();showDonutTip(event,'${info}')"></circle>`;
  });
  const svg = total ? `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
    </svg>` : `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-bg)" stroke-width="${thickness}"></circle>
    </svg>`;

  const ongoing = items.filter(i => !i.completed);
  const doneCount = items.length - ongoing.length;
  let longestName='—', longestDays=null;
  ongoing.forEach(i => {
    if(i.startDate){
      const d = daysBetween(i.startDate, todayISO());
      if(longestDays===null || d>longestDays){ longestDays=d; longestName = i.sahaAdi || i.sahaKodu || '—'; }
    }
  });

  return `<div class="donut-summary">
    <div class="donut-left">
      <div class="donut-big">
        ${svg}
        <div class="donut-big-hole"><div class="num">${total}</div><div class="lbl">saha</div></div>
      </div>
      <div class="legend-list">${legendRows}</div>
    </div>
    <div class="mini-stats">
      <div><div class="mini-stat-lbl">Devam eden / Tamamlanan</div><div class="mini-stat-val">${ongoing.length} / ${doneCount}</div></div>
      <div><div class="mini-stat-lbl">En uzun bekleyen</div><div class="mini-stat-val">${longestDays!==null ? escapeHtml(longestName)+' · '+longestDays+' gün' : '—'}</div></div>
    </div>
  </div>`;
}

function render(){
  // render() her Firestore onSnapshot tetiklendiğinde (yani başka BİR saha
  // değişse, mail otomasyonu arka planda bir alan güncellese, hatta kendi
  // kaydımızın sunucu onayı gelse bile) yeniden çağrılabiliyor. Açık bir
  // satır içi düzenleme formu varsa, kullanıcının o ana kadar yazdıklarını
  // kaybetmemek için önce formu STATE.editing.item'a senkronize ediyoruz.
  syncEditingFormToState_();

  // Odaklı bir alan (arama kutusu veya form içindeki herhangi bir input/
  // textarea/select) varsa, render sonrası odağı ve imleç konumunu geri
  // veriyoruz — aksi halde her render'da kullanıcı sanki kutunun dışına
  // tıklamış gibi odağını kaybediyor.
  const activeEl = document.activeElement;
  const restoreFocusId = (activeEl && activeEl.id && document.getElementById('content') && document.getElementById('content').contains(activeEl)) ? activeEl.id : null;
  const selStart = (restoreFocusId && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
  const selEnd = (restoreFocusId && typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null;

  const cat = STATE.tab;
  document.getElementById('subtitle').textContent = cat === 'kule'
    ? 'Kule üzeri saha ilerleme takibi · 8 adımlı süreç'
    : 'Bina üzeri saha ilerleme takibi · 5 adımlı süreç';

  if(!STATE.loaded[cat]){
    document.getElementById('content').innerHTML = '<div class="empty">Yükleniyor…</div>';
    return;
  }

  const items = STATE.data[cat] || [];
  const total = items.length;
  const done = items.filter(i=>i.completed).length;
  const ongoing = total-done;
  const stalled = items.filter(i=>!i.completed && i.startDate && daysBetween(i.startDate, todayISO())>60).length;

  let filtered = items.filter(i => {
    if(STATE.filter==='done' && !i.completed) return false;
    if(STATE.filter==='ongoing' && i.completed) return false;
    if(STATE.filter==='stalled' && !(!i.completed && i.startDate && daysBetween(i.startDate, todayISO())>60)) return false;
    if(STATE.search){
      const s = STATE.search.toLocaleLowerCase('tr-TR');
      if(!(i.sahaKodu+' '+i.sahaAdi+' '+i.sahaNo).toLocaleLowerCase('tr-TR').includes(s)) return false;
    }
    return true;
  });
  filtered = filtered.slice().sort((a,b) => {
    if(a.completed !== b.completed) return a.completed ? 1 : -1;
    const da = a.startDate ? daysBetween(a.startDate, todayISO()) : -1;
    const db_ = b.startDate ? daysBetween(b.startDate, todayISO()) : -1;
    return db_ - da;
  });

  const labels = labelsFor(cat);
  let html = '';
  html += `<div class="metrics">
    <div class="metric clickable ${STATE.filter==='all'?'active':''}" onclick="onFilter('all')"><div class="lbl">Toplam saha</div><div class="val">${total}</div></div>
    <div class="metric clickable ${STATE.filter==='ongoing'?'active':''}" onclick="onFilter('ongoing')"><div class="lbl">Devam eden</div><div class="val">${ongoing}</div></div>
    <div class="metric clickable ${STATE.filter==='done'?'active':''}" onclick="onFilter('done')"><div class="lbl">Tamamlanan</div><div class="val">${done}</div></div>
    <div class="metric clickable ${STATE.filter==='stalled'?'active':''}" onclick="onFilter('stalled')"><div class="lbl">Gecikiyor (60+ gün)</div><div class="val">${stalled}</div></div>
  </div>`;

  if(total > 0){
    html += `<div class="card" style="margin-bottom:16px;">
      <div class="dist-title">Süreç özeti · toplam ${total} saha</div>
      <div class="dist-sub">Sahaların adımlara göre dağılımı.</div>
      ${buildSummaryPanel(items, labels)}
    </div>`;
  }

  html += `<div class="controls">
    <input type="text" id="searchInput" class="search" placeholder="Saha kodu, adı veya no ara" value="${escapeHtml(STATE.search)}" oninput="onSearch(this.value)">
    <select onchange="onFilter(this.value)">
      <option value="all" ${STATE.filter==='all'?'selected':''}>Tümü</option>
      <option value="ongoing" ${STATE.filter==='ongoing'?'selected':''}>Devam eden</option>
      <option value="done" ${STATE.filter==='done'?'selected':''}>Tamamlanan</option>
      <option value="stalled" ${STATE.filter==='stalled'?'selected':''}>Gecikiyor (60+ gün)</option>
    </select>
    <button class="btn" onclick="exportToExcel()">Tümünü Excel'e aktar</button>
    <button class="btn" onclick="openContactsModal()" style="${STATE.isAdmin?'':'display:none'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Taşeron mailleri</button>
    <button class="btn" onclick="openCcContactsModal()" style="${STATE.isAdmin?'':'display:none'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Şirket içi mailler</button>
    <button class="btn" onclick="openTrashModal()" style="${STATE.isAdmin?'':'display:none'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 7V19a2 2 0 002 2h8a2 2 0 002-2V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Silinenler</button>
    <button class="btn primary" onclick="openAddModal()" style="${STATE.isAdmin?'':'display:none'}">+ Yeni saha ekle</button>
  </div>`;

  if(filtered.length === 0){
    html += `<div class="empty">${total===0 ? 'Henüz saha eklenmemiş.' : 'Aramanızla eşleşen saha bulunamadı.'}</div>`;
  } else {
    html += '<div class="list">';
    filtered.forEach(item => {
      const st = computeStatus(item);
      const stepLabel = item.currentStep>0 && item.currentStep<=labels.length ? labels[item.currentStep-1] : 'Başlamadı';
      let counterHtml = '';
      if(item.startDate){
        if(item.completed){
          counterHtml = st.days !== null
            ? `<span class="counter">Başlangıç: <b>${fmtDate(item.startDate)}</b> · Tamamlanma: <b>${fmtDate(item.completionDate)}</b> · Süre: <b>${st.days} gün</b></span>`
            : `<span class="counter">Başlangıç: <b>${fmtDate(item.startDate)}</b> · Tamamlandı</span>`;
        } else {
          counterHtml = `<span class="counter">Başlangıç: <b>${fmtDate(item.startDate)}</b> · <b>${st.days}</b> gündür devam ediyor</span>`;
        }
      } else {
        counterHtml = `<span class="counter">Başlangıç tarihi girilmemiş</span>`;
      }
      html += `<div class="card">
        <div class="card-top">
          <div class="card-left">
            <div class="saha-name">${escapeHtml(item.sahaAdi || '(isimsiz saha)')}</div>
            <div class="saha-meta">${escapeHtml(item.sahaKodu||'')}${item.sahaNo ? ' · Saha No: '+escapeHtml(item.sahaNo) : ''}</div>
            <div class="tags">
              ${item.enerji ? `<span class="tag energy">${escapeHtml(item.enerji)}</span>` : ''}
              <span class="status ${st.statusClass}">${st.statusText}</span>
            </div>
          </div>
          <div class="card-right">
            <div class="donut" style="--pct:${st.pct};--clr:${item.completed?'var(--green)':'var(--accent)'}"><div class="donut-hole">%${st.pct}</div></div>
          </div>
        </div>
        <div class="step-label">Adım ${item.currentStep||0}/${item.totalSteps||labels.length}: ${escapeHtml(stepLabel)}</div>
        ${item.aciklama ? `<div class="aciklama">${escapeHtml(item.aciklama)}</div>` : ''}
        <div class="counter-row">
          ${counterHtml}
          <div class="card-actions" style="${STATE.isAdmin?'':'display:none'}">
            <button class="btn small" onclick="toggleInlineEdit('${cat}','${item.id}')">${(STATE.editing && STATE.editing.cat===cat && STATE.editing.id===item.id) ? 'Kapat' : 'Düzenle'}</button>
            <button class="btn small danger" onclick="deleteItem('${cat}','${item.id}')">Sil</button>
          </div>
        </div>
      </div>
      ${(STATE.editing && STATE.editing.cat===cat && STATE.editing.id===item.id) ? renderInlineEditForm(cat, item.id, STATE.editing.item, labels) : ''}`;
    });
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
  renderEmailDatalist();
  if(STATE.editing && STATE.editing.mode==='inline'){
    const editLabels = labelsFor(STATE.editing.cat);
    bindStepSelectListener_(editLabels, STATE.editing.item);
    bindQuickAssignSync_(STATE.editing.item, editLabels);
    bindAccordionDetails_();
  }

  if(restoreFocusId){
    const newActiveEl = document.getElementById(restoreFocusId);
    if(newActiveEl){
      newActiveEl.focus();
      if(selStart!=null && typeof newActiveEl.setSelectionRange === 'function'){
        try{ newActiveEl.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function onSearch(v){ STATE.search=v; render(); }

function collectKnownEmails_(){
  const set = new Set();
  ['kule','bina'].forEach(cat => {
    (STATE.data[cat] || []).forEach(it => {
      if(it.contactEmail) set.add(it.contactEmail.trim());
      (it.stepContacts||[]).forEach(e => { if(e && e.trim()) set.add(e.trim()); });
    });
  });
  return Array.from(set).sort();
}
function renderEmailDatalist(){
  const el = document.getElementById('tasheronList');
  if(!el) return;
  el.innerHTML = collectKnownEmails_().map(e => `<option value="${escapeHtml(e)}">`).join('');
}

function buildSheetRows(cat){
  const labels = labelsFor(cat);
  const items = (STATE.data[cat] || []).slice().sort((a,b) => (a.sahaAdi||'').localeCompare(b.sahaAdi||''));
  return items.map(item => {
    const st = computeStatus(item);
    const stepLabel = item.currentStep>0 && item.currentStep<=labels.length ? labels[item.currentStep-1] : 'Başlamadı';
    return {
      'Saha Kodu': item.sahaKodu || '',
      'Saha No': item.sahaNo || '',
      'Enerji': item.enerji || '',
      'Saha Adı': item.sahaAdi || '',
      'Açıklama': item.aciklama || '',
      'Bulunduğu Adım': `${item.currentStep||0}/${item.totalSteps||labels.length} · ${stepLabel}`,
      'İlerleme (%)': st.pct,
      'Durum': st.statusText,
      'Başlangıç Tarihi': item.startDate ? fmtDate(item.startDate) : '',
      'Tamamlanma Tarihi': item.completionDate ? fmtDate(item.completionDate) : '',
      'Gün Sayısı': st.days !== null ? st.days : '',
    };
  });
}

// Excel'e aktarma iki katmanlı: önce ExcelJS ile RENKLİ ve TÜM ADIMLARIN
// DETAYINI içeren dosyayı denenir; o kütüphane herhangi bir sebeple (ağ
// sorunu, engellenmiş CDN vb.) yüklenemediyse otomatik olarak sade ama HER
// ZAMAN çalışan eski yönteme (exportToExcelBasic_) geri dönülür — böylece
// "Excel'e aktar" hiçbir durumda veri kaybına ya da hataya yol açmaz.
async function exportToExcel(){
  if(window.ExcelJS){
    try{
      await exportToExcelStyled_();
      return;
    }catch(e){
      console.error('Renkli Excel oluşturulamadı, sade formata geçiliyor:', e);
    }
  }
  exportToExcelBasic_();
}

function exportToExcelBasic_(){
  const colWidths = [ {wch:14},{wch:10},{wch:14},{wch:26},{wch:34},{wch:24},{wch:10},{wch:14},{wch:14},{wch:16},{wch:10} ];
  const wb = XLSX.utils.book_new();

  const wsKule = XLSX.utils.json_to_sheet(buildSheetRows('kule'));
  wsKule['!cols'] = colWidths;
  XLSX.utils.book_append_sheet(wb, wsKule, 'Kule Üzeri');

  const wsBina = XLSX.utils.json_to_sheet(buildSheetRows('bina'));
  wsBina['!cols'] = colWidths;
  XLSX.utils.book_append_sheet(wb, wsBina, 'Bina Üzeri');

  const fname = `saha-takip-${todayISO()}.xlsx`;
  XLSX.writeFile(wb, fname);
}

// Sütun numarasını Excel harfine çevirir (1->A, 27->AA, ...) — formül
// metinlerinde hücre adresi üretmek için kullanılıyor.
function colLetter_(n){
  let s = '';
  while(n > 0){
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
// "YYYY-MM-DD" metnini, saat dilimi kaymasına uğramayan GERÇEK bir Excel
// tarihine (JS Date, yerel gün/ay/yıl ile) çeviriyor — böylece Excel'de bu
// hücrelerle tarih farkı gibi formüller (=Tamamlanma-Başlangıç) çalışır.
function toExcelDate_(iso){
  if(!iso) return null;
  const parts = String(iso).split('-');
  if(parts.length !== 3) return null;
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
  if(!y || !m || !d) return null;
  return new Date(y, m-1, d);
}

// Bir kategori (kule/bina) için, TÜM adımların not/kişi/gün/tarih bilgisini
// içeren, renklendirilmiş, FORMÜLLÜ (İlerleme %, Durum, Gün Sayısı Excel'in
// kendisi tarafından hesaplanıyor — dosyayı ileride açtığında güncel kalır)
// ve başlıkları donmuş (freeze pane) bir sayfa oluşturur. Hiçbir veri
// özetlenip atılmıyor — her adımın kendi sütunu var.
function addStyledSheet_(wb, cat, sheetName){
  const labels = labelsFor(cat);
  const items = (STATE.data[cat] || []).slice().sort((a,b) => (a.sahaAdi||'').localeCompare(b.sahaAdi||'', 'tr'));
  const ws = wb.addWorksheet(sheetName, { views:[{ state:'frozen', xSplit:0, ySplit:2 }] });

  const fixedCols = [
    { header:'Saha Kodu', width:14 }, { header:'Saha No', width:12 }, { header:'Enerji', width:16 },
    { header:'Saha Adı', width:26 }, { header:'Açıklama', width:32 },
    { header:'Şu Anki Adım', width:12 }, { header:'Toplam Adım', width:12 }, { header:'Adım Adı', width:24 },
    { header:'İlerleme (%)', width:12 }, { header:'Durum', width:16 },
    { header:'Başlangıç Tarihi', width:14 }, { header:'Tamamlanma Tarihi', width:16 }, { header:'Gün Sayısı', width:11 },
    { header:'Son Düzenleyen', width:16 },
  ];
  // Formüllerde referans vereceğimiz sabit sütunların indeksleri (1 = A).
  const COL = {
    cur: fixedCols.findIndex(c=>c.header==='Şu Anki Adım')+1,
    tot: fixedCols.findIndex(c=>c.header==='Toplam Adım')+1,
    prog: fixedCols.findIndex(c=>c.header==='İlerleme (%)')+1,
    durum: fixedCols.findIndex(c=>c.header==='Durum')+1,
    start: fixedCols.findIndex(c=>c.header==='Başlangıç Tarihi')+1,
    comp: fixedCols.findIndex(c=>c.header==='Tamamlanma Tarihi')+1,
    days: fixedCols.findIndex(c=>c.header==='Gün Sayısı')+1,
  };
  const perStepHeaders = ['Not', 'Kişi (mail)', 'Kaç gün sonra', 'Tarih'];

  // 1. satır: sabit sütunlar için tek büyük birleşik başlık hücresi, her
  // adım için de "N. Adım adı" yazan 4 sütunu kapsayan birleşik hücre.
  const totalFixed = fixedCols.length;
  ws.mergeCells(1, 1, 1, totalFixed);
  const genelCell = ws.getCell(1, 1);
  genelCell.value = 'Genel bilgiler (İlerleme / Durum / Gün Sayısı sütunları Excel formülüdür — canlı hesaplanır)';
  labels.forEach((lbl, i) => {
    const startCol = totalFixed + 1 + i*perStepHeaders.length;
    const endCol = startCol + perStepHeaders.length - 1;
    ws.mergeCells(1, startCol, 1, endCol);
    const cell = ws.getCell(1, startCol);
    cell.value = `${i+1}. ${lbl}`;
  });

  // 2. satır: gerçek sütun başlıkları.
  const headerRowValues = fixedCols.map(c => c.header);
  labels.forEach(() => { headerRowValues.push(...perStepHeaders); });
  const headerRow = ws.getRow(2);
  headerRow.values = headerRowValues;

  [1,2].forEach(r => {
    ws.getRow(r).eachCell({ includeEmpty:true }, cell => {
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0F766E' } };
      cell.font = { bold:true, color:{ argb:'FFFFFFFF' }, size: r===1?12:11 };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      cell.border = { top:{style:'thin',color:{argb:'FF0B5A57'}}, bottom:{style:'thin',color:{argb:'FF0B5A57'}}, left:{style:'thin',color:{argb:'FF0B5A57'}}, right:{style:'thin',color:{argb:'FF0B5A57'}} };
    });
  });
  ws.getRow(1).height = 20;
  ws.getRow(2).height = 30;

  // Sütun genişlikleri.
  fixedCols.forEach((c, i) => { ws.getColumn(i+1).width = c.width; });
  labels.forEach((_, i) => {
    const base = totalFixed + i*perStepHeaders.length;
    ws.getColumn(base+1).width = 30; // Not
    ws.getColumn(base+2).width = 26; // Kişi
    ws.getColumn(base+3).width = 13; // Kaç gün sonra
    ws.getColumn(base+4).width = 12; // Tarih
  });

  // Veri satırları — HİÇBİR alan atlanmıyor, her adımın notu/kişisi/günü/
  // tarihi ayrı bir sütunda tek tek yer alıyor. İlerleme (%), Durum ve Gün
  // Sayısı sütunları GERÇEK EXCEL FORMÜLÜ: dosyayı Excel'de açtığında (ör.
  // haftalar sonra) hâlâ doğru sonucu gösterirler, sadece o anki durumun
  // donmuş bir fotoğrafı değildirler.
  items.forEach((item, idx) => {
    const r = idx + 3; // 1 ve 2. satırlar başlık; veri 3. satırdan başlıyor.
    const stepLabel = item.currentStep>0 && item.currentStep<=labels.length ? labels[item.currentStep-1] : 'Başlamadı';
    const curL = colLetter_(COL.cur), totL = colLetter_(COL.tot), startL = colLetter_(COL.start), compL = colLetter_(COL.comp);
    const rowValues = [
      item.sahaKodu||'', item.sahaNo||'', item.enerji||'', item.sahaAdi||'', item.aciklama||'',
      item.currentStep||0, item.totalSteps||labels.length, stepLabel,
      { formula: `IFERROR(ROUND(${curL}${r}/${totL}${r}*100,0),0)` },
      { formula: `IF(${curL}${r}>=${totL}${r},"Tamamlandı",IF(AND(${startL}${r}<>"",(TODAY()-${startL}${r})>60),"Gecikiyor (60+ gün)","Devam ediyor"))` },
      toExcelDate_(item.startDate), toExcelDate_(item.completionDate),
      { formula: `IF(${compL}${r}<>"",${compL}${r}-${startL}${r},IF(${startL}${r}<>"",TODAY()-${startL}${r},""))` },
      item.updatedBy || '',
    ];
    labels.forEach((_, i) => {
      rowValues.push(
        (item.stepNotes && item.stepNotes[i]) || '',
        (item.stepContacts && item.stepContacts[i]) || '',
        (item.stepMailDays && item.stepMailDays[i]!=null && item.stepMailDays[i]!=='') ? item.stepMailDays[i] : '',
        toExcelDate_(item.stepDates && item.stepDates[i]),
      );
    });
    const row = ws.addRow(rowValues);
    row.getCell(COL.start).numFmt = 'dd.mm.yyyy';
    row.getCell(COL.comp).numFmt = 'dd.mm.yyyy';
    labels.forEach((_, i) => {
      const dateCol = totalFixed + i*perStepHeaders.length + 4;
      row.getCell(dateCol).numFmt = 'dd.mm.yyyy';
    });
    const zebra = idx % 2 === 1;
    row.eachCell({ includeEmpty:true }, (cell, colNumber) => {
      cell.alignment = { vertical:'middle', wrapText: colNumber===5, horizontal: (colNumber===COL.prog||colNumber===COL.durum) ? 'center' : undefined };
      cell.border = { top:{style:'hair',color:{argb:'FFDDE2E8'}}, bottom:{style:'hair',color:{argb:'FFDDE2E8'}}, left:{style:'hair',color:{argb:'FFDDE2E8'}}, right:{style:'hair',color:{argb:'FFDDE2E8'}} };
      if(zebra && colNumber !== COL.durum){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF7F9FA' } }; }
    });
    row.getCell(COL.durum).font = { bold:true };
  });

  ws.autoFilter = { from:{ row:2, column:1 }, to:{ row:2, column: headerRowValues.length } };
  ws.views = [{ state:'frozen', xSplit:0, ySplit:2 }];

  // Koşullu biçimlendirme: "Durum" metnine göre renk (formül sonucu neyse
  // renk de ONA göre — istatistik dosya oluştuktan sonra değişse bile
  // (ör. bir saha 60 günü geçince) renk de otomatik güncellenir), ve
  // "İlerleme (%)" sütununda görsel bir veri çubuğu.
  const lastRow = items.length + 2;
  if(items.length > 0){
    const durumL = colLetter_(COL.durum), progL = colLetter_(COL.prog);
    ws.addConditionalFormatting({
      ref: `${durumL}3:${durumL}${lastRow}`,
      rules: [
        { type:'containsText', operator:'containsText', text:'Tamamlandı', priority:1,
          formulae:[`NOT(ISERROR(SEARCH("Tamamlandı",${durumL}3)))`],

async function exportToExcelStyled_(){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Saha Takip Dashboard';
  wb.created = new Date();
  addStyledSheet_(wb, 'kule', 'Kule Üzeri');
  addStyledSheet_(wb, 'bina', 'Bina Üzeri');
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `saha-takip-${todayISO()}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function onFilter(v){ STATE.filter=v; render(); }

function emptyItem(cat){
  const total = labelsFor(cat).length;
  return { sahaKodu:'', sahaNo:'', enerji:'', sahaAdi:'', aciklama:'', hikaye:'',
    stepNotes:new Array(total).fill(''), stepContacts:new Array(total).fill(''), stepMailDays:new Array(total).fill(''),
    currentStep:0, totalSteps:total,
    completed:false, startDate:todayISO(), completionDate:null };
}
function openAddModal(){
  if(!STATE.isAdmin){ openLoginModal(); return; }
  const fresh = emptyItem(STATE.tab);
  STATE.editing = { cat: STATE.tab, id:null, item: fresh, original: JSON.parse(JSON.stringify(fresh)), mode:'modal' };
  renderModal();
}
function toggleInlineEdit(cat, id){
  if(!STATE.isAdmin){ openLoginModal(); return; }
  if(STATE.editing && STATE.editing.mode==='inline' && STATE.editing.cat===cat && STATE.editing.id===id){
    STATE.editing = null; render(); return;
  }
  const item = STATE.data[cat].find(i=>i.id===id);
  if(!item) return;
  const copy = JSON.parse(JSON.stringify(item));
  const total = labelsFor(cat).length;
  if(!copy.stepNotes || copy.stepNotes.length !== total) copy.stepNotes = new Array(total).fill('');
  if(!copy.stepContacts || copy.stepContacts.length !== total) copy.stepContacts = new Array(total).fill('');
  if(!copy.stepMailDays || copy.stepMailDays.length !== total) copy.stepMailDays = new Array(total).fill('');
  // "original": düzenleme başladığı andaki DEĞİŞMEYECEK anlık görüntü.
  // "item" ise formda o an yazılanları yansıtan CANLI kopya — arka planda
  // render() tekrar çalıştığında kullanıcının yazdıklarının kaybolmaması için
  // syncEditingFormToState_() bunu sürekli günceller (bkz. o fonksiyonun
  // yorumu). saveItem() değişip değişmediğini ve "önceki" adım/tarih gibi
  // bilgileri hep "original"dan okumalı — yoksa "item" zaten güncel forma eşit
  // hale geldiği için hiçbir şey değişmemiş gibi görünür.
  STATE.editing = { cat, id, item: copy, original: JSON.parse(JSON.stringify(copy)), mode:'inline' };
  render();
}
function closeModal(){
  const wasModal = STATE.editing && STATE.editing.mode==='modal';
  STATE.editing = null;
  if(wasModal){ document.getElementById('modalRoot').innerHTML=''; } else { render(); }
}

function contactSelectOptions_(selectedEmail){
  let opts = `<option value="">— seçiniz —</option>`;
  let found = false;
  STATE.contacts.forEach(c => {
    const sel = c.email === selectedEmail;
    if(sel) found = true;
    opts += `<option value="${escapeHtml(c.email)}" ${sel?'selected':''}>${escapeHtml(c.label ? (c.label+' · '+c.email) : c.email)}</option>`;
  });
  if(selectedEmail && !found){
    opts += `<option value="${escapeHtml(selectedEmail)}" selected>${escapeHtml(selectedEmail)} (listede yok)</option>`;
  }
  return opts;
}

function bindStepSelectListener_(labels, item){
  const stepSel = document.getElementById('f_currentStep');
  if(!stepSel) return;
  stepSel.addEventListener('change', () => {
    const v = parseInt(stepSel.value,10);
    const wrap = document.getElementById('f_compDateWrap');
    if(wrap) wrap.style.display = v>=labels.length ? '' : 'none';
    const qc = document.getElementById('quickContactLabel');
    if(qc) qc.textContent = v>=1 ? (v+'. '+labels[v-1]) : '—';
    const qSel = document.getElementById('f_quickContact');
    if(qSel){
      const val = (v>=1 && item.stepContacts) ? (item.stepContacts[v-1]||'') : '';
      qSel.innerHTML = contactSelectOptions_(val);
    }
    const qDays = document.getElementById('f_quickMailDays');
    if(qDays){
      qDays.value = (v>=1 && item.stepMailDays && item.stepMailDays[v-1]!=null) ? item.stepMailDays[v-1] : '';
    }
  });
}

// "Şu anki adımın taşeron maili" (hızlı atama) kutuları ile "Tüm adımların
// notlarını / maillerini göster" altındaki, BULUNULAN ADIMLA AYNI İNDEKSE
// denk gelen kişi/gün kutuları, aslında aynı veriyi (stepContacts[i] /
// stepMailDays[i]) iki farklı yerden gösteriyor. Eskiden saveItem() bulunulan
// adım için hızlı atama kutusundaki değeri KOŞULSUZ olarak per-adım kutusunun
// ÜZERİNE yazıyordu — yani kullanıcı "Tüm adımların..." bölümünü açıp o
// adımın kişisini/gününü oradan değiştirdiğinde, formun üstündeki (eski,
// dokunulmamış) hızlı atama değeri sessizce geri yazılıp yapılan değişikliği
// siliyordu. Çözüm: iki kutuyu CANLI olarak birbirine bağlıyoruz, böylece
// hangisinden değiştirilirse değiştirilsin ikisi de hep aynı (güncel) değeri
// gösteriyor ve kaydederken tek, tutarlı bir kaynaktan (per-adım kutusu)
// okunuyor.
// Düzenleme formundaki "Saha hikayesi", "Tüm adımların notları" ve "Sürüm
// geçmişi" bölümleri ayrı ayrı açılıp kapanabiliyordu; hepsi aynı anda açık
// kalınca form uzayıp karışıyordu. Bunları bir "akordeon" gibi davranacak
// şekilde bağlıyoruz: biri açılınca, aynı formdaki diğer açık olanlar otomatik
// kapanıyor — aynı anda sadece bir bölüm açık kalıyor.
function bindAccordionDetails_(){
  const detailsEls = Array.from(document.querySelectorAll('details.acc-detail'));
  detailsEls.forEach(d => {
    d.addEventListener('toggle', () => {
      if(d.open){
        detailsEls.forEach(other => { if(other!==d && other.open) other.open = false; });
      }
    });
  });
}

// Sürüm geçmişini toplu olarak temizler ("Tüm geçmişi temizle" düğmesi).
async function clearAllHistory(cat, id){
  if(!STATE.isAdmin) return;
  if(!confirm('Bu sahanın tüm sürüm geçmişi kalıcı olarak silinsin mi? Bu işlem geri alınamaz.')) return;
  try{
    await fdb.collection(collFor(cat)).doc(id).update({ history: [] });
    if(STATE.editing && STATE.editing.id===id){
      STATE.editing.item.history = [];
      if(STATE.editing.original) STATE.editing.original.history = [];
    }
  }catch(e){
    console.error(e);
    alert('Sürüm geçmişi silinemedi: bağlantı sorunu olabilir.');
  }
}

function bindQuickAssignSync_(item, labels){
  const quickSel = document.getElementById('f_quickContact');
  const quickDays = document.getElementById('f_quickMailDays');
  const stepSel = document.getElementById('f_currentStep');
  const curIdx = () => {
    const v = parseInt(stepSel ? stepSel.value : item.currentStep, 10);
    return (v>=1 && v<=labels.length) ? v-1 : -1;
  };
  if(quickSel){
    quickSel.addEventListener('change', () => {
      const idx = curIdx();
      if(idx<0) return;
      const target = document.getElementById('stepContact_'+idx);
      if(target) target.value = quickSel.value;
    });
  }
  if(quickDays){
    quickDays.addEventListener('input', () => {
      const idx = curIdx();
      if(idx<0) return;
      const target = document.getElementById('stepMailDays_'+idx);
      if(target) target.value = quickDays.value;
    });
  }
  labels.forEach((_,i) => {
    const contactEl = document.getElementById('stepContact_'+i);
    if(contactEl){
      contactEl.addEventListener('change', () => {
        if(curIdx() === i && quickSel) quickSel.value = contactEl.value;
      });
    }
    const daysEl = document.getElementById('stepMailDays_'+i);
    if(daysEl){
      daysEl.addEventListener('input', () => {
        if(curIdx() === i && quickDays) quickDays.value = daysEl.value;
      });
    }
  });
}

// Satır içi ("inline") düzenleme formu, sahaların listesiyle AYNI render()
// fonksiyonu tarafından çiziliyor. Firestore'daki onSnapshot dinleyicisi ise
// bu koleksiyona yapılan HERHANGİ bir yazmada (başka bir saha düzenlense,
// mail otomasyonu arka planda bir alanı güncellese, hatta kendi kaydımızın
// sunucudan geri dönen onayında bile) render()'ı tekrar çağırıyor. render()
// de STATE.editing.item'daki (formu AÇARKEN alınmış, kullanıcının o ana
// kadar YAZDIKLARINI içermeyen) eski kopyadan formu YENİDEN oluşturuyordu —
// yani kullanıcı bir adımın kişisini/gün sayısını/notunu yazarken arka
// planda bambaşka bir kayıt değişse bile, ekrandaki yazdıkları sessizce
// silinip eski haline dönüyordu. "Kaydet"e basıldığında da artık DOM'da
// eski (değişmemiş) değerler olduğu için hiçbir şey kaydedilmiş gibi
// görünmüyordu, ama sürüm geçmişine yine de yeni bir kayıt ekleniyordu.
// Çözüm: her render()'dan HEMEN ÖNCE, formdaki mevcut (kullanıcının o ana
// kadar yazdığı) değerleri STATE.editing.item'a geri yazıyoruz, böylece
// form yeniden çizilse bile kullanıcının girdiği veriler korunuyor.
function syncEditingFormToState_(){
  if(!STATE.editing || STATE.editing.mode !== 'inline') return;
  const item = STATE.editing.item;
  const labels = labelsFor(STATE.editing.cat);
  const g = (elId) => document.getElementById(elId);

  if(g('f_sahaKodu')) item.sahaKodu = g('f_sahaKodu').value;
  if(g('f_sahaNo')) item.sahaNo = g('f_sahaNo').value;
  if(g('f_sahaAdi')) item.sahaAdi = g('f_sahaAdi').value;
  if(g('f_enerji')) item.enerji = g('f_enerji').value;
  if(g('f_startDate')) item.startDate = g('f_startDate').value || null;
  if(g('f_aciklama')) item.aciklama = g('f_aciklama').value;
  if(g('f_contactEmail')) item.contactEmail = g('f_contactEmail').value;
  if(g('f_hikaye')) item.hikaye = g('f_hikaye').value;
  if(g('f_completionDate')) item.completionDate = g('f_completionDate').value || null;
  if(g('f_currentStep')) item.currentStep = parseInt(g('f_currentStep').value,10);

  if(!item.stepNotes || item.stepNotes.length!==labels.length) item.stepNotes = new Array(labels.length).fill('');
  if(!item.stepContacts || item.stepContacts.length!==labels.length) item.stepContacts = new Array(labels.length).fill('');
  if(!item.stepMailDays || item.stepMailDays.length!==labels.length) item.stepMailDays = new Array(labels.length).fill('');

  labels.forEach((_,i) => {
    const noteEl = g('stepNote_'+i);
    if(noteEl) item.stepNotes[i] = noteEl.value;
    const contactEl = g('stepContact_'+i);
    if(contactEl) item.stepContacts[i] = contactEl.value.trim();
    const daysEl = g('stepMailDays_'+i);
    if(daysEl) item.stepMailDays[i] = daysEl.value!=='' ? parseInt(daysEl.value,10) : '';
  });

  // NOT: hızlı atama kutuları ("Şu anki adımın taşeron maili") artık
  // bindQuickAssignSync_() ile per-adım kutularına CANLI bağlı — ayrıca
  // burada tekrar üzerine yazmaya gerek yok (bkz. bindQuickAssignSync_
  // yorumu). Aksi halde bu iki kutu birbirinden habersiz kalıp biri
  // diğerinin yaptığı değişikliği sessizce silebiliyordu.
}

async function saveItem(){
  if(!STATE.isAdmin){ return; }
  const { cat, id, item } = STATE.editing;
  // "original": düzenleme açıldığı andaki DEĞİŞMEMİŞ hal — "kaydetmeden
  // önceki adım neydi", "sürüm geçmişine ne kaydedilecek", "hiçbir şey
  // değişmedi mi" gibi karşılaştırmalar hep buradan yapılmalı. "item" artık
  // formun o anki CANLI aynası olduğu için (bkz. syncEditingFormToState_),
  // "item" ile karşılaştırmak her zaman "değişmedi" sonucu verir.
  const original = STATE.editing.original || item;
  const labels = labelsFor(cat);
  const sahaAdi = document.getElementById('f_sahaAdi').value.trim();
  const errEl = document.getElementById('formErr');
  if(!sahaAdi){ errEl.textContent='Saha adı zorunludur.'; errEl.style.display='block'; return; }
  const currentStep = parseInt(document.getElementById('f_currentStep').value,10);
  const stepNotes = labels.map((_,i) => { const el=document.getElementById('stepNote_'+i); return el?el.value:''; });
  const stepContacts = labels.map((_,i) => { const el=document.getElementById('stepContact_'+i); return el?el.value.trim():''; });
  const stepMailDays = labels.map((_,i) => { const el=document.getElementById('stepMailDays_'+i); return (el && el.value!=='') ? parseInt(el.value,10) : ''; });
  // NOT: "Şu anki adımın taşeron maili" (hızlı atama) kutuları artık
  // bindQuickAssignSync_() ile ilgili per-adım kutusuna CANLI bağlı, yani
  // stepContacts/stepMailDays zaten yukarıdaki per-adım kutularından doğru
  // okunuyor — burada ayrıca üzerine yazmıyoruz (bkz. bindQuickAssignSync_).
  const startDate = document.getElementById('f_startDate').value || null;
  const completed = currentStep >= labels.length;
  let completionDate = null;
  if(completed) completionDate = document.getElementById('f_completionDate').value || todayISO();
  // stepDates: mail scriptindeki gecikme sayacı (getEntryDate) bu diziyi okuyor.
  // Adım değiştiyse, yeni adıma bugün girildiğini kaydediyoruz (var olan tarihleri koruyarak).
  const stepDates = (original.stepDates && original.stepDates.length===labels.length) ? original.stepDates.slice() : new Array(labels.length).fill(null);
  if(currentStep>=1 && currentStep!==original.currentStep){ stepDates[currentStep-1] = todayISO(); }
  const doc = {
    sahaKodu: document.getElementById('f_sahaKodu').value.trim(),
    sahaNo: document.getElementById('f_sahaNo').value.trim(),
    enerji: document.getElementById('f_enerji').value.trim(),
    sahaAdi, aciklama: document.getElementById('f_aciklama').value.trim(),
    contactEmail: document.getElementById('f_contactEmail').value.trim(),
    hikaye: (document.getElementById('f_hikaye')?document.getElementById('f_hikaye').value.trim():(original.hikaye||'')),
    stepNotes, stepContacts, stepMailDays, stepDates, currentStep, totalSteps: labels.length, completed, startDate, completionDate,
    // Adım elle değiştirildiyse, o adım için "bildirim gönderildi" bilgisini
    // sıfırlıyoruz — otomatik ilerlemede (mailscript.gs / processReplies) zaten
    // aynısı yapılıyor. Bu olmadan, bir adım geri alınıp tekrar aynı adıma
    // getirildiğinde sistem "zaten bildirdim" sanıp mail atmayı atlayabiliyordu.
    notifiedStep: (currentStep !== original.currentStep) ? null : (original.notifiedStep ?? null),
    updatedAt: new Date().toISOString(),
    // Bu değişikliği hangi kullanıcı yaptı — sürüm geçmişinde ve saha detayında
    // "kim düzenledi" bilgisini gösterebilmek için.
    updatedBy: STATE.authUsername || null,
  };
  // SÜRÜM GEÇMİŞİ: kaydetmeden önceki hali "history" dizisine ekliyoruz —
  // biri yanlışlıkla bir tarihi/adımı değiştirip kaydederse, düzenleme
  // panelindeki "Sürüm geçmişi" bölümünden bir önceki (veya daha eski) haline
  // geri dönebilir. Sonsuza kadar büyümesin diye son 15 kayıtla sınırlıyoruz.
  // Gerçekten bir şey DEĞİŞMEDİYSE (ör. form hiçbir alan değiştirilmeden
  // "Kaydet"e basıldıysa) geçmişe boş/tekrarlayan bir kayıt eklemiyoruz —
  // aksi halde liste anlamsız kayıtlarla şişip kafa karıştırıyordu.
  if(id){
    const prevSnapshot = {...original};
    delete prevSnapshot.history;
    delete prevSnapshot.updatedAt;
    delete prevSnapshot.updatedBy;
    // Karşılaştırmayı sadece kullanıcının GERÇEKTEN değiştirebileceği
    // alanlarla sınırlıyoruz (id, history, notifiedStep, updatedAt/By gibi
    // "yan" alanlar hariç) — aksi halde eski kayıtta bulunup doc'ta hiç
    // bulunmayan bir alan (ör. id) yüzünden hiçbir şey değişmese bile
    // "değişti" sanılabiliyordu.
    const compareKeys = ['sahaKodu','sahaNo','enerji','sahaAdi','aciklama','contactEmail','hikaye',
      'stepNotes','stepContacts','stepMailDays','stepDates','currentStep','totalSteps','completed',
      'startDate','completionDate'];
    const comparableDoc = {}; compareKeys.forEach(k => comparableDoc[k] = doc[k]);
    const comparablePrev = {}; compareKeys.forEach(k => comparablePrev[k] = prevSnapshot[k]);
    const changed = JSON.stringify(comparableDoc) !== JSON.stringify(comparablePrev);
    if(changed){
      const existingHistory = Array.isArray(original.history) ? original.history : [];
      doc.history = [{ savedAt: new Date().toISOString(), snapshot: prevSnapshot }, ...existingHistory].slice(0,15);
    } else if(Array.isArray(original.history)){
      doc.history = original.history;
    }
  }
  try{
    const coll = fdb.collection(collFor(cat));
    if(id){
      await coll.doc(id).update(doc);
    } else {
      const newId = 'saha_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      await coll.doc(newId).set(doc);
    }
    closeModal();
  }catch(e){
    console.error(e);
    errEl.textContent = 'Kaydedilemedi: bağlantı sorunu olabilir.';
    errEl.style.display = 'block';
  }
}

// Düzenleme panelindeki "Sürüm geçmişi" listesinden bir kayda dönmek için.
// Şu anki hali de tekrar geçmişe eklenir, böylece bu işlem de geri alınabilir.
async function revertToVersion(cat, id, idx){
  if(!STATE.isAdmin) return;
  if(!confirm('Bu sürüme dönülsün mü? Şu anki hali de geçmişe kaydedilecek, isterseniz sonra tekrar geri dönebilirsiniz.')) return;
  try{
    const coll = fdb.collection(collFor(cat));
    const snap = await coll.doc(id).get();
    if(!snap.exists){ alert('Saha bulunamadı.'); return; }
    const current = snap.data();
    const history = Array.isArray(current.history) ? current.history : [];
    const entry = history[idx];
    if(!entry){ alert('Bu sürüm artık bulunamadı.'); return; }
    const prevSnapshot = {...current};
    delete prevSnapshot.history;
    const newHistory = [{ savedAt: new Date().toISOString(), snapshot: prevSnapshot }, ...history].slice(0,15);
    const restored = { ...entry.snapshot, history: newHistory, updatedAt: new Date().toISOString() };
    delete restored.id;
    await coll.doc(id).set(restored);
  }catch(e){
    alert('Geri alınamadı: bağlantı sorunu olabilir.');
    return;
  }
  closeModal();
}

async function deleteItem(cat, id){
  if(!STATE.isAdmin){ return; }
  if(!confirm('Bu sahayı silmek istediğinize emin misiniz? (Yanlışlıkla silerseniz "Silinenler" listesinden geri getirebilirsiniz.)')) return;
  try{
    // Kalıcı silmek yerine önce "çöp kutusu" koleksiyonuna taşıyoruz, sonra
    // asıl listeden kaldırıyoruz — böylece yanlışlık olursa geri getirilebilir.
    const coll = fdb.collection(collFor(cat));
    const snap = await coll.doc(id).get();
    if(snap.exists){
      const data = snap.data();
      await fdb.collection(trashCollFor(cat)).doc(id).set({ ...data, deletedAt: new Date().toISOString() });
    }
    await coll.doc(id).delete();
  }catch(e){
    alert('Silinemedi: bağlantı sorunu olabilir.');
  }
}

async function loadAndRenderTrash(){
  try{
    const [kuleSnap, binaSnap] = await Promise.all([
      fdb.collection('trash_kule').get(),
      fdb.collection('trash_bina').get(),
    ]);
    STATE.trashItems = {
      kule: kuleSnap.docs.map(d => ({ id: d.id, ...d.data() })),
      bina: binaSnap.docs.map(d => ({ id: d.id, ...d.data() })),
    };
  }catch(e){
    console.error('trash load error', e);
  }
  renderTrashModal();
}

function openTrashModal(){
  if(!STATE.isAdmin){ openLoginModal(); return; }
  STATE.trashModalOpen = true;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay"><div class="modal"><h3>Silinenler</h3><div class="dist-sub">Yükleniyor…</div></div></div>`;
  loadAndRenderTrash();
}
function closeTrashModal(){
  STATE.trashModalOpen = false;
  document.getElementById('modalRoot').innerHTML = '';
}
function renderTrashModal(){
  const all = [
    ...(STATE.trashItems.kule||[]).map(i => ({ ...i, cat:'kule' })),
    ...(STATE.trashItems.bina||[]).map(i => ({ ...i, cat:'bina' })),
  ].sort((a,b) => (b.deletedAt||'').localeCompare(a.deletedAt||''));

  const rows = all.map(i => `
    <div class="contact-row">
      <div class="contact-row-info">
        <div class="contact-row-label">${escapeHtml(i.sahaAdi || i.sahaKodu || 'İsimsiz saha')} <span style="color:var(--text-muted);font-weight:400;">(${i.cat==='kule'?'Kule':'Bina'})</span></div>
        <div class="contact-row-email">Silinme: ${fmtDateTime(i.deletedAt)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn small" onclick="restoreFromTrash('${i.cat}','${i.id}')">Geri getir</button>
        <button class="btn small danger" onclick="permanentlyDeleteTrash('${i.cat}','${i.id}')">Kalıcı sil</button>
      </div>
    </div>`).join('') || `<div class="empty" style="padding:14px 0;">Silinmiş saha yok.</div>`;

  const html = `<div class="modal-overlay" onclick="if(event.target===this) closeTrashModal()">
    <div class="modal">
      <h3>Silinenler</h3>
      <div class="dist-sub" style="margin-bottom:14px;">Silinen sahalar burada listelenir. "Geri getir" ile sahayı eski haline (kayıtlıydı listeye) döndürebilir, "Kalıcı sil" ile tamamen kaldırabilirsiniz.</div>
      <div class="contact-list">${rows}</div>
      <div class="modal-actions"><button class="btn" onclick="closeTrashModal()">Kapat</button></div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
async function restoreFromTrash(cat, id){
  if(!STATE.isAdmin) return;
  try{
    const trashColl = fdb.collection(trashCollFor(cat));
    const snap = await trashColl.doc(id).get();
    if(!snap.exists) return;
    const data = snap.data();
    delete data.deletedAt;
    await fdb.collection(collFor(cat)).doc(id).set(data);
    await trashColl.doc(id).delete();
    loadAndRenderTrash();
  }catch(e){
    alert('Geri getirilemedi: bağlantı sorunu olabilir.');
  }
}
async function permanentlyDeleteTrash(cat, id){
  if(!STATE.isAdmin) return;
  if(!confirm('Bu sahayı kalıcı olarak silmek istediğinize emin misiniz? Bu işlem geri alınamaz.')) return;
  try{
    await fdb.collection(trashCollFor(cat)).doc(id).delete();
    loadAndRenderTrash();
  }catch(e){
    alert('Silinemedi: bağlantı sorunu olabilir.');
  }
}
