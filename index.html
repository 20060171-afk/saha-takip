// --- GİRİŞ / ÇIKIŞ (Firebase Authentication ile, ama kullanıcı adıyla) ---
// Firebase Authentication her hesap için mail-formatında bir kimlik ister;
// kullanıcıya mail sormamak için her kullanıcı adına, görünmeyen/gerçek
// olmayan bir "iç kimlik" (ör. ali.ab12cd@saha-takip-panel.local) üretip
// eşlemesini usernames/{kullanıcı_adı} belgesinde tutuyoruz. Bu sayede
// giriş ekranında sadece kullanıcı adı + şifre yeterli oluyor. Gerçek bir
// mail gönderilmediği için "şifremi unuttum" yok — unutulan bir şifre, ana
// kullanıcının o kullanıcının şifresini "Kullanıcılar" panelinden doğrudan
// değiştirmesiyle çözülür.
async function fetchUserDoc_(uid){
  try{
    const doc = await fdb.collection('users').doc(uid).get();
    if(doc.exists) return doc.data();
  }catch(e){ console.error('kullanıcı bilgisi okunamadı', e); }
  return null;
}
// İlk kurulum sırasında (bkz. doBootstrap), Firebase hesabı oluşturulur
// oluşturulmaz Firebase otomatik olarak "giriş yapıldı" bilgisini gönderir —
// ama o anda users/{uid} belgesi henüz yazılmamış olabilir (yarış durumu).
// Bu bayrak açıkken syncAuthState, "yetki belgesi yok" diye yanlışlıkla
// oturumu kapatmak yerine bekler; doBootstrap belgeleri yazdıktan sonra
// durumu kendisi doğru şekilde ayarlar.
let SKIP_AUTH_SIGNOUT_ = false;
async function syncAuthState(user){
  if(!user){
    STATE.isAdmin = false; STATE.isOwner = false; STATE.authUsername = null;
    renderAuthBadge(); render();
    return;
  }
  const data = await fetchUserDoc_(user.uid);
  if(!data){
    if(SKIP_AUTH_SIGNOUT_) return; // ilk kurulum sürüyor, henüz erken — dokunma
    // Firebase'de hesabı var ama bu panelde tanımlı bir yetkisi yok (ör. erişimi kaldırılmış).
    try{ await fauth.signOut(); }catch(e){}
    STATE.isAdmin = false; STATE.isOwner = false; STATE.authUsername = null;
    renderAuthBadge(); render();
    return;
  }
  STATE.isAdmin = true; STATE.isOwner = (data.role === 'owner'); STATE.authUsername = data.username || null;
  renderAuthBadge(); render();
}
fauth.onAuthStateChanged(user => { syncAuthState(user); });

// "Giriş yap" tıklanınca önce kurulum yapılmış mı diye bakıyoruz: hiç hesap
// yoksa (ilk kez kuruluyorsa) doğrudan "İlk kurulum" ekranını açıyoruz,
// kullanıcının bunu ayrıca bulup tıklamasına gerek kalmıyor.
async function openLoginModal(){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay"><div class="modal" style="max-width:360px;"><div class="dist-sub">Yükleniyor…</div></div></div>`;
  let setupDone = true;
  try{
    const setupDoc = await fdb.collection('meta').doc('setup_done').get();
    setupDone = setupDoc.exists;
  }catch(e){ console.error('setup_done kontrol edilemedi', e); }
  if(!setupDone){ openBootstrapModal(); return; }
  const html = `<div class="modal-overlay" onclick="if(event.target===this) closeLoginModal()">
    <div class="modal" style="max-width:360px;">
      <h3>Giriş yap</h3>
      <div class="field"><label>Kullanıcı adı</label><input type="text" id="loginUsername" autocomplete="username"></div>
      <div class="field"><label>Şifre</label><input type="password" id="loginPass" autocomplete="current-password"></div>
      <div id="loginErr" class="err" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeLoginModal()">Vazgeç</button>
        <button class="btn primary" onclick="doLogin()">Giriş yap</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  const passEl = document.getElementById('loginPass');
  passEl.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('loginUsername').focus();
}
function closeLoginModal(){ document.getElementById('modalRoot').innerHTML=''; }
async function doLogin(){
  const usernameRaw = document.getElementById('loginUsername').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  if(!usernameRaw || !pass){ errEl.textContent = 'Kullanıcı adı ve şifre gerekli.'; errEl.style.display = 'block'; return; }
  const key = usernameRaw.toLowerCase();
  try{
    const mapDoc = await fdb.collection('usernames').doc(key).get();
    if(!mapDoc.exists){
      errEl.textContent = 'Kullanıcı adı veya şifre hatalı.';
      errEl.style.display = 'block';
      return;
    }
    const authEmail = mapDoc.data().authEmail;
    const cred = await fauth.signInWithEmailAndPassword(authEmail, pass);
    const data = await fetchUserDoc_(cred.user.uid);
    if(!data){
      await fauth.signOut();
      errEl.textContent = 'Bu hesap için panelde yetki tanımlı değil. Ana kullanıcıyla iletişime geçin.';
      errEl.style.display = 'block';
      return;
    }
    closeLoginModal(); // arayüz, onAuthStateChanged ile otomatik güncellenecek
  }catch(e){
    let msg = 'Kullanıcı adı veya şifre hatalı.';
    if(e && e.code === 'auth/too-many-requests') msg = 'Çok fazla hatalı deneme yapıldı, birazdan tekrar deneyin.';
    if(e && e.code === 'auth/user-disabled') msg = 'Bu hesap devre dışı bırakılmış.';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
}
function logout(){
  fauth.signOut();
}

// --- İLK KURULUM (sadece hiç hesap yokken çalışır, Firebase Console'a hiç girmeden) ---
function openBootstrapModal(){
  const html = `<div class="modal-overlay" onclick="if(event.target===this) closeBootstrapModal()">
    <div class="modal" style="max-width:380px;">
      <h3>İlk kurulum — ana yönetici hesabı</h3>
      <p style="font-size:13px;color:var(--muted);margin-top:-4px;">Sitede henüz hiç hesap yok. İstediğiniz kullanıcı adı ve şifreyi seçin; bu hesap ana yönetici (tüm yetkiler) olacak.</p>
      <div class="field"><label>Kullanıcı adı</label><input type="text" id="bootUsername" autocomplete="username" value="admin"></div>
      <div class="field"><label>Şifre (en az 6 karakter)</label><input type="password" id="bootPass" autocomplete="new-password"></div>
      <div class="field"><label>Şifre (tekrar)</label><input type="password" id="bootPass2" autocomplete="new-password"></div>
      <div id="bootErr" class="err" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeBootstrapModal()">Vazgeç</button>
        <button class="btn primary" onclick="doBootstrap()">Hesabı oluştur</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('bootUsername').focus();
}
function closeBootstrapModal(){ document.getElementById('modalRoot').innerHTML=''; }
async function doBootstrap(){
  const usernameRaw = document.getElementById('bootUsername').value.trim();
  const pass = document.getElementById('bootPass').value;
  const pass2 = document.getElementById('bootPass2').value;
  const errEl = document.getElementById('bootErr');
  errEl.style.display = 'none';
  if(!usernameRaw || !/^[a-zA-Z0-9._-]{3,32}$/.test(usernameRaw)){
    errEl.textContent = 'Kullanıcı adı en az 3 karakter olmalı; sadece harf, rakam, nokta, alt çizgi veya tire içerebilir.';
    errEl.style.display = 'block';
    return;
  }
  if(!pass || pass.length < 6){ errEl.textContent = 'Şifre en az 6 karakter olmalı.'; errEl.style.display = 'block'; return; }
  if(pass !== pass2){ errEl.textContent = 'Şifreler aynı değil.'; errEl.style.display = 'block'; return; }
  const key = usernameRaw.toLowerCase();
  try{
    const setupDoc = await fdb.collection('meta').doc('setup_done').get();
    if(setupDoc.exists){
      errEl.textContent = 'Kurulum zaten yapılmış. Lütfen ana kullanıcı hesabıyla giriş yapın.';
      errEl.style.display = 'block';
      return;
    }
    const uniquePart = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const authEmail = key.replace(/[^a-z0-9._-]/g,'x') + '.' + uniquePart + '@saha-takip-panel.local';
    SKIP_AUTH_SIGNOUT_ = true; // users/{uid} belgesi yazılana kadar syncAuthState'in erken tetiklenip oturumu kapatmasını engelle
    const cred = await fauth.createUserWithEmailAndPassword(authEmail, pass);
    const uid = cred.user.uid;
    await fdb.collection('users').doc(uid).set({ username: usernameRaw, role:'owner', addedAt: new Date().toISOString() });
    await fdb.collection('usernames').doc(key).set({ uid, authEmail, updatedAt: new Date().toISOString() });
    await fdb.collection('meta').doc('setup_done').set({ createdAt: new Date().toISOString() });
    SKIP_AUTH_SIGNOUT_ = false;
    await syncAuthState(fauth.currentUser); // belgeler artık hazır — durumu şimdi kesin olarak ayarla
    closeBootstrapModal();
  }catch(e){
    SKIP_AUTH_SIGNOUT_ = false;
    let msg = 'Kurulum tamamlanamadı: bağlantı sorunu olabilir.';
    if(e && e.code === 'auth/weak-password') msg = 'Şifre çok zayıf, daha uzun bir şifre deneyin.';
    if(e && e.code === 'auth/email-already-in-use') msg = 'Bir sorun oluştu, lütfen tekrar deneyin.';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
}

// --- KULLANICILAR (sadece ana kullanıcı) ---
// Yardımcı kullanıcı eklemek, ana kullanıcının oturumunu bozmadan yapılmalı;
// bunun için geçici, ikincil bir Firebase bağlantısı kullanılıyor. Ana
// kullanıcı, herhangi bir kullanıcının şifresini bu panelden doğrudan

async function loadAndRenderUsers(){

function openUsersModal(){

}
function closeUsersModal(){
  STATE.usersModalOpen = false;
  document.getElementById('modalRoot').innerHTML = '';
}
function renderUsersModal(){
  const rows = STATE.users.map(u => `
    <div class="contact-row" style="align-items:flex-end;">

        <div class="contact-row-label">${escapeHtml(u.username||u.uid)} ${u.role==='owner' ? '<span style="color:var(--accent-text);font-weight:600;">(Ana kullanıcı)</span>' : ''}</div>

      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn small" onclick="resetUserPassword('${u.uid}')">Şifreyi değiştir</button>
        ${u.role!=='owner' ? `<button class="btn small danger" onclick="removeUserAccess('${u.uid}','${escapeHtml((u.username||'').toLowerCase())}')">Erişimi kaldır</button>` : ''}
      </div>
    </div>`).join('') || `<div class="empty" style="padding:14px 0;">Henüz yardımcı kullanıcı yok.</div>`;

  const html = `<div class="modal-overlay" onclick="if(event.target===this) closeUsersModal()">
    <div class="modal">
      <h3>Kullanıcılar</h3>
      <div class="dist-sub" style="margin-bottom:14px;">Kullanıcı adı ve şifreleri siz belirlersiniz. Bir kullanıcı şifresini unutursa, satırındaki kutuya yeni bir şifre yazıp "Şifreyi değiştir" deyin — mevcut şifreyi bilmenize gerek yok.</div>
      <div class="contact-list">${rows}</div>
      <div class="row2" style="margin-top:14px;">
        <div class="field"><label>Kullanıcı adı</label><input type="text" id="newUserUsername" placeholder="örn. kullanici1" autocomplete="off"></div>
        <div class="field"><label>Şifre (en az 6 karakter)</label><input type="text" id="newUserPass" placeholder="ilk giriş şifresi"></div>
      </div>
      <div id="userErr" class="err" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeUsersModal()">Kapat</button>
        <button class="btn primary" onclick="addUserSubmit()">Kullanıcı ekle</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
async function addUserSubmit(){
  const usernameRaw = document.getElementById('newUserUsername').value.trim();
  const pass = document.getElementById('newUserPass').value;
  const errEl = document.getElementById('userErr');
  errEl.style.display = 'none';
  if(!usernameRaw || !/^[a-zA-Z0-9._-]{3,32}$/.test(usernameRaw)){
    errEl.textContent = 'Kullanıcı adı en az 3 karakter olmalı; sadece harf, rakam, nokta, alt çizgi veya tire içerebilir.';
    errEl.style.display = 'block';
    return;
  }
  if(!pass || pass.length < 6){ errEl.textContent='Şifre en az 6 karakter olmalı.'; errEl.style.display='block'; return; }
  const key = usernameRaw.toLowerCase();
  let secondaryApp;
  try{
    const existing = await fdb.collection('usernames').doc(key).get();
    if(existing.exists){ errEl.textContent='Bu kullanıcı adı zaten kullanılıyor.'; errEl.style.display='block'; return; }
    // Dışarıya hiç gitmeyecek, sadece Firebase'in iç kimliği olarak kullanılacak
    // benzersiz bir "sahte mail" üretiyoruz — her ekleme farklı bir kimlik alır,
    // böylece aynı kullanıcı adı silinip tekrar eklendiğinde çakışma olmaz.
    const uniquePart = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const authEmail = key.replace(/[^a-z0-9._-]/g,'x') + '.' + uniquePart + '@saha-takip-panel.local';
    secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary_' + Date.now());
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(authEmail, pass);
    const uid = cred.user.uid;
    await secondaryApp.auth().signOut();
    await fdb.collection('users').doc(uid).set({ username: usernameRaw, role:'helper', addedAt: new Date().toISOString() });
    await fdb.collection('usernames').doc(key).set({ uid, authEmail, updatedAt: new Date().toISOString() });
    loadAndRenderUsers();
  }catch(e){
    let msg = 'Kullanıcı eklenemedi.';
    if(e && e.code === 'auth/weak-password') msg = 'Şifre çok zayıf, daha uzun bir şifre deneyin.';
    errEl.textContent = msg; errEl.style.display = 'block';
  }finally{
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(e){} }
  }
}
// Ana kullanıcı, bir kullanıcının (kendisi dahil) şifresini mevcut şifreyi
// bilmeden doğrudan değiştirir — ikincil bağlantı ile: hedef kullanıcı adına
// yeniden giriş yapılıp updatePassword çağrılır, ana kullanıcının kendi
// oturumu (birincil bağlantı) hiç etkilenmez.
async function resetUserPassword(uid){
  if(!STATE.isOwner) return;
  const el = document.getElementById('userPass_'+uid);
  if(!el) return;
  const newPass = el.value;
  if(!newPass || newPass.length < 6){ alert('Yeni şifre en az 6 karakter olmalı.'); return; }
  const target = STATE.users.find(u => u.uid === uid);
  if(!target){ alert('Kullanıcı bulunamadı.'); return; }
  let secondaryApp;
  try{
    const mapDoc = await fdb.collection('usernames').doc((target.username||'').toLowerCase()).get();
    if(!mapDoc.exists){ alert('Kullanıcı kaydı bulunamadı.'); return; }
    const authEmail = mapDoc.data().authEmail;
    secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary_' + Date.now());
    // Not: şifreyi mevcut şifreyi bilmeden değiştirmenin (owner yetkisiyle)
    // Firebase Authentication'da doğrudan bir yolu yok; bu yüzden burada
    // yeni şifreyi geçici olarak hesabın kendisine yazmak yerine, kullanıcıyı
    // silip aynı kullanıcı adıyla (yeni bir iç kimlikle) yeniden oluşturuyoruz
    // — sonuç, kullanıcı için aynı: sadece kullanıcı adı ve yeni şifreyle giriş yapar.
    const uniquePart = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const key = (target.username||'').toLowerCase();
    const newAuthEmail = key.replace(/[^a-z0-9._-]/g,'x') + '.' + uniquePart + '@saha-takip-panel.local';
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(newAuthEmail, newPass);
    const newUid = cred.user.uid;
    await secondaryApp.auth().signOut();
    await fdb.collection('users').doc(newUid).set({ username: target.username, role: target.role, addedAt: target.addedAt || new Date().toISOString() });
    await fdb.collection('usernames').doc(key).set({ uid: newUid, authEmail: newAuthEmail, updatedAt: new Date().toISOString() });
    await fdb.collection('users').doc(uid).delete();
    if(STATE.authUsername && key === STATE.authUsername.toLowerCase() && uid !== newUid){
      // Kendi şifresini değiştirdiyse, eski oturum artık geçersiz — tekrar giriş yapması gerekir.
      await fauth.signOut();
    }
    loadAndRenderUsers();
    alert('Şifre güncellendi.');
  }catch(e){
    alert('Şifre değiştirilemedi: bağlantı sorunu olabilir.');
  }finally{
    if(secondaryApp){ try{ await secondaryApp.delete(); }catch(e){} }
  }
}
async function removeUserAccess(uid, usernameKey){
  if(!STATE.isOwner) return;
  if(!confirm('Bu kullanıcının erişimi kaldırılsın mı? Kullanıcı adı böylece boşa çıkar; isterseniz aynı kullanıcı adıyla yeniden ekleyebilirsiniz.')) return;
  try{
    await fdb.collection('users').doc(uid).delete();
    if(usernameKey){ await fdb.collection('usernames').doc(usernameKey).delete(); }
    loadAndRenderUsers();
  }catch(e){
    alert('Kaldırılamadı: bağlantı sorunu olabilir.');
  }
}

/* ================= Pusula chatbot ================= */
const CHAT_STATE = { open:false, messages:[], busy:false };

function buildSiteContext(){
  // Pusula'ya gönderilecek özet veri: her sahanın kodu, adı, tipi, adımı, açıklaması.
  const lines = [];
  ['kule','bina'].forEach(cat => {
    const labels = labelsFor(cat);
    const catName = cat === 'kule' ? 'KULE ÜZERİ' : 'BİNA ÜZERİ';
    (STATE.data[cat] || []).forEach(it => {
      const st = computeStatus(it);
      const stepLabel = it.currentStep>0 && it.currentStep<=labels.length ? labels[it.currentStep-1] : 'Başlamadı';
      let line = `[${catName}] ${it.sahaKodu} - ${it.sahaAdi} | Enerji: ${it.enerji||'-'} | Adım ${it.currentStep||0}/${it.totalSteps||labels.length} (${stepLabel}) | %${st.pct} | Durum: ${st.statusText} | Açıklama: ${it.aciklama||'-'}`;
      // Taşeron maili ve bildirim durumu gibi bilgiler sadece yönetici modunda paylaşılır.
      if(STATE.isAdmin){
        const curContact = (it.currentStep>=1 && it.stepContacts) ? (it.stepContacts[it.currentStep-1]||'') : '';
        const contactInfo = curContact || it.contactEmail || 'atanmamış';
        const notifInfo = it.notifiedStep
          ? `Adım ${it.notifiedStep} için ${it.notifiedAt ? fmtDate(it.notifiedAt.slice(0,10)) : 'bilinmeyen tarihte'} gecikme bildirim maili gönderildi`
          : 'Bu saha için henüz hiç gecikme bildirim maili gönderilmedi';
        line += ` | Bu adımın taşeron maili: ${contactInfo} | Mail durumu: ${notifInfo}`;
      }
      lines.push(line);
    });
  });
  return lines.join('\n');
}

function openChat(){
  CHAT_STATE.open = true;
  document.getElementById('chatPanel').classList.add('open');
  document.getElementById('chatFab').classList.add('hidden');
  renderChat();
  document.getElementById('chatInput').focus();
}
function closeChat(){
  CHAT_STATE.open = false;
  document.getElementById('chatPanel').classList.remove('open');
  document.getElementById('chatFab').classList.remove('hidden');
}
function onChatKeydown(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
}

// Basit ve güvenli markdown-lite dönüştürücü: önce HTML olarak escape eder,
// sonra sadece **kalın** ve satır başı "- " madde işaretlerini biçimlendirir.
// Escape önce yapıldığı için kullanıcıdan/AI'den gelen metin HTML enjekte edemez.
function chatFormat_(text){
  let s = escapeHtml(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/^- /gm, '• ');
  return s;
}

function renderChat(){
  const body = document.getElementById('chatBody');
  if(!CHAT_ENDPOINT_URL){
    body.innerHTML = `<div class="chat-not-configured">Pusula henüz devreye alınmadı.<br>Kurulum tamamlanınca burada sahalar hakkında soru sorabileceksiniz.</div>`;
    return;
  }
  if(CHAT_STATE.messages.length === 0){
    body.innerHTML = `<div class="chat-empty">Sahalar hakkında bir şey sorun — örn. "TOMET neden bekliyor?" ya da "hangi sahalar gecikiyor?"</div>`;
    return;
  }
  body.innerHTML = CHAT_STATE.messages.map(m =>
    `<div class="chat-msg ${m.role}${m.error?' error':''}${m.typing?' typing':''}">${chatFormat_(m.text)}</div>`
  ).join('');
  body.scrollTop = body.scrollHeight;
}

async function saveQuickAssignAndTestMail(cat, id){
  if(!STATE.isAdmin) return;
  const resultEl = document.getElementById('testMailResult_'+id);
  const item = STATE.editing && STATE.editing.item;
  if(!item){ return; }
  const labels = labelsFor(cat);
  const currentStep = item.currentStep || 0;
  if(currentStep < 1){
    if(resultEl){ resultEl.style.color='var(--red-text)'; resultEl.textContent = 'Önce sahayı bir adıma alın.'; }
    return;
  }
  const idx = currentStep - 1;

  // Panelde şu an ekranda görünen (henüz "Kaydet"e basılmamış) taşeron mail /
  // gün seçimini önce Firestore'a kaydediyoruz, böylece "Test maili gönder"
  // ayrı bir kaydetme adımı gerektirmeden ekrandaki seçimi kullanabiliyor.
  const quickEl = document.getElementById('f_quickContact');
  const quickDaysEl = document.getElementById('f_quickMailDays');
  const contact = quickEl ? quickEl.value.trim() : '';
  const days = (quickDaysEl && quickDaysEl.value !== '') ? parseInt(quickDaysEl.value, 10) : '';

  const stepContacts = (item.stepContacts && item.stepContacts.length === labels.length) ? item.stepContacts.slice() : new Array(labels.length).fill('');
  const stepMailDays = (item.stepMailDays && item.stepMailDays.length === labels.length) ? item.stepMailDays.slice() : new Array(labels.length).fill('');
  stepContacts[idx] = contact;
  stepMailDays[idx] = days;

  if(resultEl){ resultEl.style.color=''; resultEl.textContent = 'Kaydediliyor…'; }
  try{
    await fdb.collection(collFor(cat)).doc(id).update({ stepContacts, stepMailDays, updatedAt: new Date().toISOString() });
    item.stepContacts = stepContacts;
    item.stepMailDays = stepMailDays;
  }catch(e){
    if(resultEl){ resultEl.style.color='var(--red-text)'; resultEl.textContent = 'Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin.'; }
    return;
  }

  sendTestMail(cat, id);
}

async function sendTestMail(cat, id){
  if(!CHAT_ENDPOINT_URL) return;
  const btn = document.getElementById('testMailBtn_'+id);
  const resultEl = document.getElementById('testMailResult_'+id);
  if(btn){ btn.disabled = true; btn.textContent = 'Gönderiliyor…'; }
  if(resultEl){ resultEl.style.color=''; resultEl.textContent = ''; }
  try{
    const resp = await fetch(CHAT_ENDPOINT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action:'sendTestMail', cat, docId:id }),
    });
    const data = await resp.json();
    if(data && data.ok){
      if(resultEl){ resultEl.style.color='var(--green-text)'; resultEl.textContent = '✓ Mail gönderildi: '+data.recipient; }
    } else {
      if(resultEl){ resultEl.style.color='var(--red-text)'; resultEl.textContent = 'Gönderilemedi: '+(data && data.error ? data.error : 'bilinmeyen hata'); }
    }
  }catch(e){
    if(resultEl){ resultEl.style.color='var(--red-text)'; resultEl.textContent = 'Bağlantı hatası, tekrar deneyin.'; }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Test maili gönder (günü bekleme)'; }
  }
}

async function sendChat(){
  if(CHAT_STATE.busy) return;
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  if(!CHAT_ENDPOINT_URL){ renderChat(); return; }

  // Son birkaç mesajı (bu soru hariç) sohbet geçmişi olarak gönderiyoruz,
  // böylece "o sahada" / "neden" gibi takip sorularını anlayabiliyor.
  const history = CHAT_STATE.messages.filter(m => !m.typing).slice(-8).map(m => ({ role:m.role, text:m.text }));

  input.value = '';
  CHAT_STATE.messages.push({ role:'user', text:q });
  CHAT_STATE.messages.push({ role:'bot', text:'yazıyor…', typing:true });
  CHAT_STATE.busy = true;
  renderChat();

  try{
    const resp = await fetch(CHAT_ENDPOINT_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' }, // Apps Script CORS preflight'tan kaçınmak için text/plain
      body: JSON.stringify({ question:q, context: buildSiteContext(), history }),
    });
    const data = await resp.json();
    CHAT_STATE.messages.pop(); // "yazıyor…" mesajını kaldır
    if(data && data.answer){
      CHAT_STATE.messages.push({ role:'bot', text:data.answer });
    } else {
      CHAT_STATE.messages.push({ role:'bot', text:'Bir cevap alınamadı.', error:true });
    }
  }catch(e){
    console.error(e);
    CHAT_STATE.messages.pop();
    CHAT_STATE.messages.push({ role:'bot', text:'Bağlantı hatası, tekrar deneyin.', error:true });
  }
  CHAT_STATE.busy = false;
  renderChat();
}

function updateHeroClock(){

  const timeEl = document.getElementById('heroClockTime');
  const dateEl = document.getElementById('heroClockDate');
  if(timeEl) timeEl.textContent = now.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(dateEl) dateEl.textContent = now.toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
